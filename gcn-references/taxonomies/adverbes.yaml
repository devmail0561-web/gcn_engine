taxonomy: adverbes
version: "1.0"
description: Classification des adverbes selon leur dimension causale dans la Grammaire Causale Naturelle

classes:
  intensite:
    dimension: force
    causal_effect: modulation de la force causale
    examples_fr:
      - lemma: "très"
        value: 0.9
      - lemma: "peu"
        value: 0.2
      - lemma: "extrêmement"
        value: 1.0
      - lemma: "assez"
        value: 0.5
      - lemma: "légèrement"
        value: 0.15
      - lemma: "fortement"
        value: 0.85
      - lemma: "à peine"
        value: 0.05

  temps:
    dimension: temporalité
    causal_effect: ancrage temporel de la cause
    examples_fr:
      - lemma: "maintenant"
        anchor: present
      - lemma: "hier"
        anchor: passe_proche
      - lemma: "demain"
        anchor: futur_proche
      - lemma: "autrefois"
        anchor: passe_lointain
      - lemma: "bientôt"
        anchor: futur_imminent
      - lemma: "jadis"
        anchor: passe_lointain
      - lemma: "désormais"
        anchor: present_ouvert

  frequence:
    dimension: récurrence
    causal_effect: répétition du lien causal
    examples_fr:
      - lemma: "toujours"
        kind: universelle
      - lemma: "souvent"
        kind: haute
      - lemma: "parfois"
        kind: intermittente
      - lemma: "rarement"
        kind: basse
      - lemma: "jamais"
        kind: nulle
      - lemma: "régulièrement"
        kind: périodique

  maniere:
    dimension: modalité
    causal_effect: qualification du mécanisme causal
    examples_fr:
      - lemma: "rapidement"
        note: vitesse du processus
      - lemma: "lentement"
        note: décélération causale
      - lemma: "violemment"
        note: intensité du mécanisme
      - lemma: "progressivement"
        note: gradualité du déroulement
      - lemma: "brutalement"
        note: absence de transition
      - lemma: "silencieusement"
        note: absence de signal observable

  lieu:
    dimension: spatialité
    causal_effect: localisation de l'effet causal
    examples_fr:
      - lemma: "ici"
        anchor: proximal
      - lemma: "là-bas"
        anchor: distal
      - lemma: "partout"
        scope: universelle
      - lemma: "nulle part"
        scope: nulle
      - lemma: "ailleurs"
        anchor: alternatif
      - lemma: "dedans"
        anchor: interieur

  negation:
    dimension: polarité
    causal_effect: inversion ou annulation du lien causal
    examples_fr:
      - lemma: "ne...pas"
        total: true
      - lemma: "ne...plus"
        note: cessation
      - lemma: "ne...jamais"
        note: négation fréquentielle
      - lemma: "ne...guère"
        note: négation partielle
      - lemma: "ne...rien"
        note: négation de l'objet

  probabilite:
    dimension: certitude
    causal_effect: degré de certitude du lien causal
    examples_fr:
      - lemma: "certainement"
        value: 0.95
      - lemma: "probablement"
        value: 0.75
      - lemma: "peut-être"
        value: 0.5
      - lemma: "vraisemblablement"
        value: 0.8
      - lemma: "possiblement"
        value: 0.4
      - lemma: "nécessairement"
        value: 1.0
