taxonomy: prepositions
version: "1.0"
description: Classification des prépositions selon leur fonction causale dans la Grammaire Causale Naturelle

classes:
  spatiale:
    role: Localisation spatiale de l'entité ou du processus causal
    examples_fr:
      - lemma: "dans"
        note: intériorité
      - lemma: "sur"
        note: surface de contact
      - lemma: "sous"
        note: position inférieure
      - lemma: "entre"
        note: position intermédiaire
      - lemma: "devant"
        note: antériorité spatiale
      - lemma: "derrière"
        note: postériorité spatiale

  temporelle:
    role: Ancrage temporel du lien causal
    examples_fr:
      - lemma: "depuis"
        note: origine temporelle ouverte
      - lemma: "pendant"
        note: durée du processus
      - lemma: "avant"
        note: antériorité temporelle
      - lemma: "après"
        note: postériorité temporelle
      - lemma: "durant"
        note: extension temporelle
      - lemma: "dès"
        note: déclenchement immédiat

  cause:
    role: Marqueur de la source causale
    examples_fr:
      - lemma: "à cause de"
        note: cause négative
      - lemma: "grâce à"
        note: cause positive
      - lemma: "en raison de"
        note: cause neutre
      - lemma: "par suite de"
        note: cause séquentielle
      - lemma: "du fait de"
        note: cause factuelle

  moyen:
    role: Instrument ou mécanisme causal
    examples_fr:
      - lemma: "par"
        note: agent ou instrument
      - lemma: "avec"
        note: accompagnement instrumental
      - lemma: "au moyen de"
        note: instrument explicite
      - lemma: "grâce à"
        note: instrument bénéfique
      - lemma: "via"
        note: chemin causal

  but:
    role: Finalité causale inversant la direction temporelle de l'explication
    causal_direction: inversée
    examples_fr:
      - lemma: "pour"
        note: finalité directe
      - lemma: "afin de"
        note: finalité explicite
      - lemma: "en vue de"
        note: finalité prospective
      - lemma: "dans le but de"
        note: finalité intentionnelle
      - lemma: "de manière à"
        note: finalité méthodique
