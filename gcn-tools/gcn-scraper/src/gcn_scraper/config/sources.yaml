# Configuration des sources de scraping — aucune URL dans le code source
scraping:
  target_total: 50000
  min_quality: 0.3

sources:
  wikipedia_fr:
    api_url: "https://fr.wikipedia.org/w/api.php"
    article_base_url: "https://fr.wikipedia.org/wiki/"
    lang: "fr"
    category_prefix: "Catégorie"
    max_results_per_query: 20
    max_chars_per_article: 5000
    rate_limit_delay: 0.3
    pagination_limit: 50
    budget_weight: 2.0
    enabled: true
    fallback_categories:
      - "Épidémiologie"
      - "Médecine"
      - "Chimie"
      - "Informatique"
      - "Économie"
      - "Psychologie"
      - "Algorithme"
      - "Droit_français"
      - "Sciences_sociales"
      - "Géologie"
      - "Pharmacologie"
      - "Biologie"

  wikipedia_en:
    api_url: "https://en.wikipedia.org/w/api.php"
    article_base_url: "https://en.wikipedia.org/wiki/"
    lang: "en"
    category_prefix: "Category"
    max_results_per_query: 20
    max_chars_per_article: 5000
    rate_limit_delay: 0.3
    pagination_limit: 50
    budget_weight: 2.0
    enabled: true
    fallback_categories:
      - "Epidemiology"
      - "Medicine"
      - "Chemistry"
      - "Computer_science"
      - "Economics"
      - "Psychology"
      - "Algorithms"
      - "Law"
      - "Ecology"
      - "Physics"
      - "Pharmacology"
      - "Biology"

  hal:
    api_url: "https://api.archives-ouvertes.fr/search/"
    lang: "fr"
    max_per_query: 100
    rate_limit_delay: 1.0
    enabled: true

  arxiv:
    api_url: "https://export.arxiv.org/api/query"
    lang: "en"
    max_per_query: 100
    rate_limit_delay: 3.0
    enabled: true

  news_rss:
    rate_limit_delay: 1.0
    enabled: true
    feeds:
      fr:
        - name: "lemonde_sciences"
          url: "https://www.lemonde.fr/sciences/rss_full.xml"
        - name: "lemonde_planete"
          url: "https://www.lemonde.fr/planete/rss_full.xml"
        - name: "lemonde_economie"
          url: "https://www.lemonde.fr/economie/rss_full.xml"
        - name: "lemonde_politique"
          url: "https://www.lemonde.fr/politique/rss_full.xml"
        - name: "liberation_societe"
          url: "https://www.liberation.fr/arc/outboundfeeds/rss/?outputType=xml"
        - name: "lefigaro_sante"
          url: "https://www.lefigaro.fr/rss/figaro_sante.xml"
        - name: "lefigaro_sciences"
          url: "https://www.lefigaro.fr/rss/figaro_sciences.xml"
      en:
        - name: "guardian_science"
          url: "https://www.theguardian.com/science/rss"
        - name: "guardian_environment"
          url: "https://www.theguardian.com/environment/rss"
        - name: "guardian_technology"
          url: "https://www.theguardian.com/technology/rss"
        - name: "guardian_world"
          url: "https://www.theguardian.com/world/rss"
        - name: "bbc_science"
          url: "http://feeds.bbci.co.uk/news/science_and_environment/rss.xml"
        - name: "bbc_technology"
          url: "http://feeds.bbci.co.uk/news/technology/rss.xml"
        - name: "reuters_science"
          url: "https://feeds.reuters.com/reuters/scienceNews"
        - name: "reuters_technology"
          url: "https://feeds.reuters.com/reuters/technologyNews"

  github:
    api_url: "https://api.github.com/search/code"
    api_repos_url: "https://api.github.com/search/repositories"
    rate_limit_delay: 0.5
    max_per_query: 30
    enabled: true
    languages:
      - python
      - rust
      - javascript
      - typescript
      - java
      - go
    queries:
      python:
        - "if error raise"
        - "if result then"
        - "because error"
        - "therefore return"
        - "thus we can"
        - "since the function"
        - "when the value"
        - "enables the user"
        - "causes the error"
        - "prevents the access"
        - "if condition then"
      rust:
        - "if let Some"
        - "match result"
        - "unwrap because"
        - "expect because"
        - "therefore we"
        - "thus the compiler"
        - "since the trait"
        - "when the error"
        - "enables safety"
        - "causes panic"
        - "prevents undefined"
      javascript:
        - "if condition returns"
        - "because callback"
        - "therefore async"
        - "enables the component"
        - "causes memory leak"
        - "prevents default"
        - "when event fires"
        - "since the promise"
        - "thus the function"
        - "if null throws"
      typescript:
        - "if type error"
        - "because interface"
        - "therefore generic"
        - "enables type safety"
        - "causes type mismatch"
        - "prevents runtime error"
        - "when undefined check"
        - "since the type"
        - "thus we infer"
        - "if optional returns"
      java:
        - "if exception throw"
        - "because null pointer"
        - "therefore override"
        - "enables polymorphism"
        - "causes stack overflow"
        - "prevents concurrent"
        - "when synchronized"
        - "since the interface"
        - "thus we extend"
        - "if null check"
      go:
        - "if err return"
        - "because goroutine"
        - "therefore defer"
        - "enables concurrency"
        - "causes deadlock"
        - "prevents race condition"
        - "when channel closed"
        - "since the interface"
        - "thus we handle"
        - "if nil check"

  doc:
    rate_limit_delay: 0.5
    enabled: true
    urls:
      python:
        - "https://docs.python.org/3/faq/programming.html"
        - "https://docs.python.org/3/faq/design.html"
        - "https://docs.python.org/3/howto/functional.html"
        - "https://docs.python.org/3/library/exceptions.html"
        - "https://realpython.com/python-conditional-structures/"
        - "https://realpython.com/python-errors-exceptions/"
        - "https://realpython.com/python-thinking-processes/"
        - "https://realpython.com/python-data-structures/"
        - "https://realpython.com/defining-your-own-python-function/"
        - "https://realpython.com/python-inheritance/"
      rust:
