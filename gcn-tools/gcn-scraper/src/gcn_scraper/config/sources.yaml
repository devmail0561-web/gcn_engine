# Configuration des sources de scraping — aucune URL dans le code source
sources:
  wikipedia_fr:
    api_url: "https://fr.wikipedia.org/w/api.php"
    article_base_url: "https://fr.wikipedia.org/wiki/"
    lang: "fr"
    category_prefix: "Catégorie"
    max_results_per_query: 20
    max_chars_per_article: 5000
    rate_limit_delay: 0.3
    pagination_limit: 50
    enabled: true
    fallback_categories:
      - "Épidémiologie"
      - "Médecine"
      - "Chimie"
      - "Informatique"
      - "Économie"
      - "Psychologie"
      - "Algorithme"
      - "Droit_français"
      - "Sciences_sociales"
      - "Géologie"
      - "Pharmacologie"
      - "Biologie"

  wikipedia_en:
    api_url: "https://en.wikipedia.org/w/api.php"
    article_base_url: "https://en.wikipedia.org/wiki/"
    lang: "en"
    category_prefix: "Category"
    max_results_per_query: 20
    max_chars_per_article: 5000
    rate_limit_delay: 0.3
    pagination_limit: 50
    enabled: true
    fallback_categories:
      - "Epidemiology"
      - "Medicine"
      - "Chemistry"
      - "Computer_science"
      - "Economics"
      - "Psychology"
      - "Algorithms"
      - "Law"
      - "Ecology"
      - "Physics"
      - "Pharmacology"
      - "Biology"

  hal:
    api_url: "https://api.archives-ouvertes.fr/search/"
    lang: "fr"
    max_per_query: 100
    rate_limit_delay: 1.0
    enabled: true

  arxiv:
    api_url: "http://export.arxiv.org/api/query"
    lang: "en"
    max_per_query: 100
    rate_limit_delay: 3.0
    enabled: true

  news_rss:
    rate_limit_delay: 1.0
    enabled: true
    feeds:
      fr:
        - name: "lemonde_sciences"
          url: "https://www.lemonde.fr/sciences/rss_full.xml"
        - name: "lemonde_planete"
          url: "https://www.lemonde.fr/planete/rss_full.xml"
        - name: "lemonde_economie"
          url: "https://www.lemonde.fr/economie/rss_full.xml"
        - name: "lemonde_politique"
          url: "https://www.lemonde.fr/politique/rss_full.xml"
        - name: "liberation_societe"
          url: "https://www.liberation.fr/arc/outboundfeeds/rss/?outputType=xml"
        - name: "lefigaro_sante"
          url: "https://www.lefigaro.fr/rss/figaro_sante.xml"
        - name: "lefigaro_sciences"
          url: "https://www.lefigaro.fr/rss/figaro_sciences.xml"
      en:
        - name: "guardian_science"
          url: "https://www.theguardian.com/science/rss"
        - name: "guardian_environment"
          url: "https://www.theguardian.com/environment/rss"
        - name: "guardian_technology"
          url: "https://www.theguardian.com/technology/rss"
        - name: "guardian_world"
          url: "https://www.theguardian.com/world/rss"
        - name: "bbc_science"
          url: "http://feeds.bbci.co.uk/news/science_and_environment/rss.xml"
        - name: "bbc_technology"
          url: "http://feeds.bbci.co.uk/news/technology/rss.xml"
        - name: "reuters_science"
          url: "https://feeds.reuters.com/reuters/scienceNews"
        - name: "reuters_technology"
          url: "https://feeds.reuters.com/reuters/technologyNews"

search_queries:
  fr:
    - "causalité épidémiologie maladie"
    - "effets pollution environnement conséquences"
    - "conséquences économiques crise"
    - "mécanisme pathologique cause effet"
    - "facteurs favorisant croissance développement"
    - "prévention traitement médical"
    - "conditions nécessaires loi juridique"
    - "règlement juridique condition application"
    - "bien que résultats contradictoires"
    - "malgré progrès difficultés persistantes"
    - "protocole expérimental étapes séquence"
    - "processus chronologique historique"
    - "objectifs politique économique stratégie"
    - "opposition théories scientifiques controverse"
    - "algorithme données apprentissage automatique"
    - "architecture logicielle systèmes contrôle"
    - "inhibition croissance facteurs protection"
    - "mécanismes biologiques cellulaires"
    - "processus chimiques réactions synthèse"
    - "histoire événements chronologiques causes"
  en:
    - "disease causation epidemiology mechanism"
    - "climate change effects consequences"
    - "economic crisis causes consequences"
    - "pathological mechanism cause effect"
    - "enabling factors growth development"
    - "prevention treatment medical conditions"
    - "necessary conditions logic law requirements"
    - "legal requirements contract eligibility"
    - "although results show contradiction limitation"
    - "despite progress difficulties remain"
    - "step by step experimental protocol"
    - "chronological historical process events"
    - "strategic objectives policy decision"
    - "opposing theories scientific debate"
    - "machine learning training dataset algorithm"
    - "software architecture control flow execution"
    - "inhibition growth protective factors"
    - "biological mechanisms cellular"
    - "chemical processes reactions synthesis"
    - "historical events chronological causes"

sources:
  web_search:
    enabled: true
    max_results_per_query: 15
    max_chars_per_page: 5000
    rate_limit_delay: 1.0
    engines:
      - duckduckgo
      - openalex
      - pubmed
    openalex_url: "https://api.openalex.org/works"
    pubmed_search_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi"
    pubmed_fetch_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi"
