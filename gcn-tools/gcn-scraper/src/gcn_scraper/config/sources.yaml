        - "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Functions"
        - "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_promises"
        - "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function"
        - "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Loops_and_iteration"
        - "https://javascript.info/error-handling"
        - "https://javascript.info/async-await"
      typescript:
        - "https://www.typescriptlang.org/docs/handbook/2/types-from-types.html"
        - "https://www.typescriptlang.org/docs/handbook/2/narrowing.html"
        - "https://www.typescriptlang.org/docs/handbook/2/functions.html"
        - "https://www.typescriptlang.org/docs/handbook/2/conditional-types.html"
        - "https://www.typescriptlang.org/docs/handbook/declaration-files/do-s-and-don-ts.html"
      java:
        - "https://docs.oracle.com/javase/tutorial/essential/exceptions/index.html"
        - "https://docs.oracle.com/javase/tutorial/java/IandI/polymorphism.html"
        - "https://docs.oracle.com/javase/tutorial/collections/intro/index.html"
        - "https://docs.oracle.com/javase/tutorial/essential/concurrency/index.html"
        - "https://docs.oracle.com/javase/tutorial/java/generics/index.html"
      go:
        - "https://go.dev/doc/effective_go"
        - "https://go.dev/blog/error-handling-and-go"
        - "https://go.dev/doc/faq"
        - "https://go.dev/tour/concurrency/1"
        - "https://pkg.go.dev/errors"
      csharp:
        - "https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/exceptions/"
        - "https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/concepts/async/"
        - "https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/exception-handling-statements"

  wikipedia_es:
    api_url: "https://es.wikipedia.org/w/api.php"
    article_base_url: "https://es.wikipedia.org/wiki/"
    lang: "es"
    category_prefix: "Categoría"
    max_results_per_query: 20
    max_chars_per_article: 5000
    rate_limit_delay: 0.3
    pagination_limit: 50
    budget_weight: 1.0
    enabled: true

  wikipedia_de:
    api_url: "https://de.wikipedia.org/w/api.php"
    article_base_url: "https://de.wikipedia.org/wiki/"
    lang: "de"
    category_prefix: "Kategorie"
    max_results_per_query: 20
    max_chars_per_article: 5000
    rate_limit_delay: 0.3
    pagination_limit: 50
    budget_weight: 1.0
    enabled: true

  wikipedia_pt:
    api_url: "https://pt.wikipedia.org/w/api.php"
    article_base_url: "https://pt.wikipedia.org/wiki/"
    lang: "pt"
    category_prefix: "Categoria"
    max_results_per_query: 20
    max_chars_per_article: 5000
    rate_limit_delay: 0.3
    pagination_limit: 50
    budget_weight: 0.8
    enabled: true

  wikipedia_it:
    api_url: "https://it.wikipedia.org/w/api.php"
    article_base_url: "https://it.wikipedia.org/wiki/"
    lang: "it"
    category_prefix: "Categoria"
    max_results_per_query: 20
    max_chars_per_article: 5000
    rate_limit_delay: 0.3
    pagination_limit: 50
    budget_weight: 0.8
    enabled: true

  web_search:
    enabled: true
    max_results_per_query: 15
    max_chars_per_page: 5000
    rate_limit_delay: 1.0
    engines:
      - duckduckgo
      - openalex
      - pubmed
    openalex_url: "https://api.openalex.org/works"
    pubmed_search_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi"
    pubmed_fetch_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi"

