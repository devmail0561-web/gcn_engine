# Configuration des sources de scraping — aucune URL dans le code source
scraping:
  target_total: 50000
  min_quality: 0.3
  contact_email: "gcn-research@example.org"

sources:
  wikipedia_fr:
    api_url: "https://fr.wikipedia.org/w/api.php"
    article_base_url: "https://fr.wikipedia.org/wiki/"
    lang: "fr"
    category_prefix: "Catégorie"
    max_results_per_query: 20
    max_chars_per_article: 5000
    rate_limit_delay: 1.0
    pagination_limit: 50
    budget_weight: 2.0
    enabled: true
    fallback_categories:
      - "Épidémiologie"
      - "Médecine"
      - "Chimie"
      - "Informatique"
      - "Économie"
      - "Psychologie"
      - "Algorithme"
      - "Droit_français"
      - "Sciences_sociales"
      - "Géologie"
      - "Pharmacologie"
      - "Biologie"

  wikipedia_en:
    api_url: "https://en.wikipedia.org/w/api.php"
    article_base_url: "https://en.wikipedia.org/wiki/"
    lang: "en"
    category_prefix: "Category"
    max_results_per_query: 20
    max_chars_per_article: 5000
    rate_limit_delay: 1.0
    pagination_limit: 50
    budget_weight: 2.0
    enabled: true
    fallback_categories:
      - "Epidemiology"
      - "Medicine"
      - "Chemistry"
      - "Computer_science"
      - "Economics"
      - "Psychology"
      - "Algorithms"
      - "Law"
      - "Ecology"
      - "Physics"
      - "Pharmacology"
      - "Biology"

  hal:
    api_url: "https://api.archives-ouvertes.fr/search/"
    lang: "fr"
    max_per_query: 100
    rate_limit_delay: 1.0
    enabled: true
    queries_fr:
      - "causalité"
      - "relation causale"
      - "cause effet"
      - "condition nécessaire"
      - "si alors"
      - "bien que résultats"
      - "malgré contrainte"
      - "séquence étapes protocole"
      - "afin d'améliorer"
      - "en revanche comparaison"
      - "dépend des données"
      - "algorithme contrôle"
    queries_en:
      - "causal inference"
      - "cause effect"
      - "causal mechanism"
      - "conditional probability"
      - "if then implication"
      - "although despite results"
      - "sequence pipeline steps"
      - "in order to improve"
      - "in contrast to baseline"
      - "depends on data"
      - "algorithm controls training"
      - "enables learning"
      - "prevents overfitting"

  arxiv:
    api_url: "https://export.arxiv.org/api/query"
    lang: "en"
    max_per_query: 100
    rate_limit_delay: 3.0
    enabled: true

  news_rss:
    rate_limit_delay: 1.0
    enabled: true
    feeds:
      fr:
        - name: "lemonde_sciences"
          url: "https://www.lemonde.fr/sciences/rss_full.xml"
        - name: "lemonde_planete"
          url: "https://www.lemonde.fr/planete/rss_full.xml"
        - name: "lemonde_economie"
          url: "https://www.lemonde.fr/economie/rss_full.xml"
        - name: "lemonde_politique"
          url: "https://www.lemonde.fr/politique/rss_full.xml"
        - name: "liberation_societe"
          url: "https://www.liberation.fr/arc/outboundfeeds/rss/?outputType=xml"
        - name: "lefigaro_sante"
          url: "https://www.lefigaro.fr/rss/figaro_sante.xml"
        - name: "lefigaro_sciences"
          url: "https://www.lefigaro.fr/rss/figaro_sciences.xml"
      en:
        - name: "guardian_science"
          url: "https://www.theguardian.com/science/rss"
        - name: "guardian_environment"
          url: "https://www.theguardian.com/environment/rss"
        - name: "guardian_technology"
          url: "https://www.theguardian.com/technology/rss"
        - name: "guardian_world"
          url: "https://www.theguardian.com/world/rss"
        - name: "bbc_science"
          url: "http://feeds.bbci.co.uk/news/science_and_environment/rss.xml"
        - name: "bbc_technology"
          url: "http://feeds.bbci.co.uk/news/technology/rss.xml"
        - name: "reuters_science"
          url: "https://feeds.reuters.com/reuters/scienceNews"
        - name: "reuters_technology"
          url: "https://feeds.reuters.com/reuters/technologyNews"

  github:
    contact_email: "gcn-research@example.org"
    api_url: "https://api.github.com/search/code"
    api_repos_url: "https://api.github.com/search/repositories"
    rate_limit_delay: 2.0
    max_per_query: 30
    enabled: true
    languages:
      - python
      - rust
      - javascript
      - typescript
      - java
      - go
    queries:
      # Requêtes ciblant des patterns structurels dans les corps de fonctions
      # (control flow, data flow, error handling) — pas de la documentation.
      python:
        - "def if return raise"
        - "def for in if continue"
        - "def try except finally"
        - "def while True break"
        - "def if not None return"
        - "def result = [] for append"
        - "def if len == 0 return"
        - "def open with as f"
        - "def yield from"
        - "def assert isinstance raise TypeError"
      rust:
        - "fn if let Some return"
        - "fn match Ok Err"
        - "fn for in iter"
        - "fn if condition panic"
        - "fn Result Option unwrap"
        - "fn loop break continue"
        - "fn Vec push pop"
        - "fn impl self"
        - "fn where T:"
        - "fn Box dyn"
      javascript:
        - "function if return null"
        - "function try catch finally"
        - "async function await Promise"
        - "function for of if continue"
        - "function while break"
        - "function Array filter map"
        - "function throw new Error"
        - "function switch case default"
        - "const => if else return"
        - "function Object keys values"
      typescript:
        - "function if typeof return"
        - "function interface implements"
        - "async function await try catch"
        - "function T extends if"
        - "function Array<T> filter"
        - "function throw new Error"
        - "function Record<string"
        - "function optional ?? return"
        - "function as unknown as"
        - "function enum switch"
      java:
        - "if null throw NullPointerException"
        - "for int i if break"
        - "try catch Exception finally"
        - "while condition do"
        - "if instanceof return cast"
        - "List add remove contains"
        - "switch case default break"
        - "Map put get containsKey"
        - "throws IOException if"
        - "synchronized if wait notify"
      go:
        - "if err != nil return"
        - "for range if continue"
        - "switch case default"
        - "select case default timeout"
        - "defer func recover"
        - "make chan goroutine"
        - "if len == 0 return"
        - "for i := 0 i < len"
        - "errors.New if err"
        - "context.Context if cancel"

