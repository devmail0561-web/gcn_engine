        - "https://doc.rust-lang.org/book/ch10-01-syntax.html"
        - "https://doc.rust-lang.org/book/ch15-01-smart-pointers.html"
        - "https://doc.rust-lang.org/book/ch17-01-what-is-oo.html"
        - "https://rustbyexample.com/error.html"
