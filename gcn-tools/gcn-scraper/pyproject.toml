[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcn-scraper"
version = "3.0.0"
description = "Collecteur multilingue pour corpus GCN-NL — Wikipedia/HAL/arXiv/GitHub/RSS/web (FR/EN/ES/DE + code Python/Rust/JS), filtrage causal, déduplication SQLite, reprise sur interruption"
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "click>=8.0",
    "trafilatura>=1.6",
    "wikipedia-api>=0.6",
    "requests>=2.0",
    "pyyaml>=6.0",
    "ddgs>=0.1",
    "langdetect>=1.0.9",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = []

[project.scripts]
gcn-scrape = "gcn_scraper.cli:scrape_cmd"
