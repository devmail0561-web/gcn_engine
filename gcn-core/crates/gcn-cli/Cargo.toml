[package]
name = "gcn-cli"
version.workspace = true
edition = "2024"
description = "Interface en ligne de commande gcn — point d'entrée du moteur GCN-Core"
license.workspace = true
repository.workspace = true
readme = "README.md"

[[bin]]
name = "gcn"
path = "src/main.rs"

[dependencies]
gcn-ir = { path = "../gcn-ir", version = "4.0.0" }
gcn-frontend-fr = { path = "../gcn-frontend-fr", version = "4.0.0" }
gcn-frontend-en = { path = "../gcn-frontend-en", version = "4.0.0" }
gcn-frontend-code = { path = "../gcn-frontend-code", version = "4.0.0" }
gcn-frontend-graph = { path = "../gcn-frontend-graph", version = "4.0.0" }
gcn-frontend-table = { path = "../gcn-frontend-table", version = "4.0.0" }
gcn-middleend = { path = "../gcn-middleend", version = "4.0.0" }
gcn-backend = { path = "../gcn-backend", version = "4.0.0" }
gcn-verbalizer = { path = "../gcn-verbalizer", version = "4.0.0" }
clap = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
