# =============================================================================
# GCN-NL Dataset : Exemples français de base — relations causales
# =============================================================================
# Trois phrases annotées couvrant les trois relations causales fondamentales :
#   s001 — CONDITION  (si ... alors)
#   s002 — CAUSE      (parce que)
#   s003 — MOTIVATION (pour + infinitif — causalité inversée)
#
# Format : token-level (form, lemma, pos, dep_rel, dep_head, gcn)
#        + CIR (nodes, edges)
# Conventions :
#   - Node IDs : "n001", "n002", ...
#   - Sentence IDs : "s001", "s002", "s003"
#   - Edge relations : snake_case
#   - Node types : snake_case (etat, action, transition, processus, condition)
# =============================================================================

schema_version: "1.0"
source_lang: {natural: {lang: french}}
description: >
  Exemples français de base pour la Grammaire Causale Naturelle.
  Trois phrases illustrant condition, cause et motivation (causalité inversée).

document:
  id: "doc-fr-basic-001"
  lang: fr
  sentences:

    # =========================================================================
    # s001 — CONDITION
    # "Si les ventes baissent, on réduit les coûts."
    # La conjonction "si" suspend la chaîne causale : la réduction des coûts
    # ne se déclenche que si la condition (baisse des ventes) est remplie.
    # =========================================================================
    - id: "s001"
      text: "Si les ventes baissent, on réduit les coûts."
      causal_pattern: condition
      tokens:
        - id: 1
          form: "Si"
          lemma: "si"
          pos: "SCONJ"
          dep_rel: "mark"
          dep_head: 4
          gcn:
            causal_type: conjonction
            causal_class: condition
            attributes:
              direction: forward

        - id: 2
          form: "les"
          lemma: "le"
          pos: "DET"
          dep_rel: "det"
          dep_head: 3
          gcn:
            causal_type: determinant
            causal_class: defini
            attributes:
              scope: universal

        - id: 3
          form: "ventes"
          lemma: "vente"
          pos: "NOUN"
          dep_rel: "nsubj"
          dep_head: 4
          gcn:
            causal_type: nom
            causal_class: processus

        - id: 4
          form: "baissent"
          lemma: "baisser"
          pos: "VERB"
          dep_rel: "advcl"
          dep_head: 7
          gcn:
            causal_type: verbe
            causal_class: processus
            attributes:
              direction: both
              reversibility: true

        - id: 5
          form: ","
          lemma: ","
          pos: "PUNCT"
          dep_rel: "punct"
          dep_head: 4

        - id: 6
          form: "on"
          lemma: "on"
          pos: "PRON"
          dep_rel: "nsubj"
          dep_head: 7
          gcn:
            causal_type: pronom
            causal_class: indefini
            attributes:
              scope: universal

        - id: 7
          form: "réduit"
          lemma: "réduire"
          pos: "VERB"
          dep_rel: "root"
          dep_head: 0
          gcn:
            causal_type: verbe
            causal_class: action
            attributes:
              direction: forward
              reversibility: true

        - id: 8
          form: "les"
          lemma: "le"
          pos: "DET"
          dep_rel: "det"
          dep_head: 9
          gcn:
            causal_type: determinant
            causal_class: defini
            attributes:
              scope: specific

        - id: 9
          form: "coûts"
          lemma: "coût"
          pos: "NOUN"
          dep_rel: "obj"
          dep_head: 7
          gcn:
            causal_type: nom
            causal_class: patient

        - id: 10
          form: "."
          lemma: "."
          pos: "PUNCT"
          dep_rel: "punct"
          dep_head: 7

      cir:
        nodes:
          - id: "n001"
            type: processus
            label: "décroissance(ventes)"
            token_span: [3, 4]
            origin: explicit
            scope: universal
            temporal_ref: {relative: {base: 0, offset: 0}}
            temporal_index: 0
            modifiers: []
            attributes:
              entity: "ventes"
              quality: "décroissance"

          - id: "n002"
            type: action
            label: "réduire(coûts)"
            token_span: [6, 9]
            origin: explicit
            scope: universal
            temporal_ref: {relative: {base: 0, offset: 1}}
            temporal_index: 1
            modifiers: []
            attributes:
              agent: "on"
              patient: "coûts"
              agent_type: collective

        edges:
          - source: "n001"
            target: "n002"
            relation: condition
            attributes:
              confidence: 1.0
              temporal_gap:
                min: 1
                max: null
                nature: deferred
              explicit: true
              negated: false
              marker_token: 1

    # =========================================================================
    # s002 — CAUSE
    # "Le marché a souffert parce que la demande a chuté."
    # La conjonction "parce que" marque une cause explicite. La direction
    # causale est backward : l'effet (souffrance) est énoncé avant la cause
    # (chute de la demande). Le temporal_index reflète l'ordre réel.
    # =========================================================================
    - id: "s002"
      text: "Le marché a souffert parce que la demande a chuté."
      causal_pattern: cause
      tokens:
        - id: 1
          form: "Le"
          lemma: "le"
          pos: "DET"
          dep_rel: "det"
          dep_head: 2
          gcn:
            causal_type: determinant
            causal_class: defini
            attributes:
              scope: specific

        - id: 2
          form: "marché"
          lemma: "marché"
          pos: "NOUN"
          dep_rel: "nsubj"
          dep_head: 4
          gcn:
            causal_type: nom
            causal_class: patient

        - id: 3
          form: "a"
          lemma: "avoir"
          pos: "AUX"
          dep_rel: "aux"
          dep_head: 4

        - id: 4
          form: "souffert"
          lemma: "souffrir"
          pos: "VERB"
          dep_rel: "root"
          dep_head: 0
          gcn:
            causal_type: verbe
            causal_class: etat
            attributes:
              direction: none

        - id: 5
          form: "parce"
          lemma: "parce"
          pos: "SCONJ"
          dep_rel: "mark"
          dep_head: 10
          gcn:
            causal_type: conjonction
            causal_class: cause
            attributes:
              direction: backward

        - id: 6
          form: "que"
          lemma: "que"
          pos: "SCONJ"
          dep_rel: "fixed"
          dep_head: 5

        - id: 7
          form: "la"
          lemma: "le"
          pos: "DET"
          dep_rel: "det"
          dep_head: 8
          gcn:
            causal_type: determinant
            causal_class: defini
            attributes:
              scope: specific

        - id: 8
          form: "demande"
          lemma: "demande"
          pos: "NOUN"
          dep_rel: "nsubj"
          dep_head: 10
          gcn:
            causal_type: nom
            causal_class: processus

        - id: 9
          form: "a"
          lemma: "avoir"
          pos: "AUX"
          dep_rel: "aux"
          dep_head: 10

        - id: 10
          form: "chuté"
          lemma: "chuter"
          pos: "VERB"
          dep_rel: "advcl"
          dep_head: 4
          gcn:
            causal_type: verbe
            causal_class: transition
            attributes:
              direction: forward

        - id: 11
          form: "."
          lemma: "."
          pos: "PUNCT"
          dep_rel: "punct"
          dep_head: 4

      cir:
        nodes:
          - id: "n001"
            type: etat
            label: "souffrance(marché)"
            token_span: [2, 4]
            origin: explicit
            scope: specific
            temporal_ref: {relative: {base: 0, offset: 1}}
            temporal_index: 1
            modifiers: []
            attributes:
              entity: "marché"
              quality: "souffrance"

          - id: "n002"
            type: transition
            label: "chute(demande)"
            token_span: [8, 10]
            origin: explicit
            scope: specific
            temporal_ref: {relative: {base: 0, offset: 0}}
            temporal_index: 0
            modifiers: []
            attributes:
              entity: "demande"
              quality: "chute"

        edges:
          - source: "n002"
            target: "n001"
            relation: cause
            attributes:
              confidence: 1.0
              temporal_gap: null
              explicit: true
              negated: false
              marker_token: 5

    # =========================================================================
    # s003 — MOTIVATION (causalité inversée)
    # "Il travaille pour réussir."
    # La préposition "pour" marque un but — la causalité est inversée :
    # l'effet désiré (réussir) motive l'action (travailler). L'edge va
    # du but vers l'action, avec la relation "motivation".
    # =========================================================================
    - id: "s003"
      text: "Il travaille pour réussir."
      causal_pattern: motivation
      tokens:
        - id: 1
          form: "Il"
          lemma: "il"
          pos: "PRON"
          dep_rel: "nsubj"
          dep_head: 2
          gcn:
            causal_type: pronom
            causal_class: personnel

        - id: 2
          form: "travaille"
          lemma: "travailler"
          pos: "VERB"
          dep_rel: "root"
          dep_head: 0
          gcn:
            causal_type: verbe
            causal_class: action
            attributes:
              direction: forward

        - id: 3
          form: "pour"
          lemma: "pour"
          pos: "ADP"
          dep_rel: "mark"
          dep_head: 4
          gcn:
            causal_type: preposition
            causal_class: but
            attributes:
              direction: backward

        - id: 4
          form: "réussir"
          lemma: "réussir"
          pos: "VERB"
          dep_rel: "advcl"
          dep_head: 2
          gcn:
            causal_type: verbe
            causal_class: transition
            attributes:
              direction: forward

        - id: 5
          form: "."
          lemma: "."
          pos: "PUNCT"
          dep_rel: "punct"
          dep_head: 2

      cir:
        nodes:
          - id: "n001"
            type: action
            label: "travailler(il)"
            token_span: [1, 2]
            origin: explicit
            scope: specific
            temporal_ref: {relative: {base: 0, offset: 0}}
            temporal_index: 0
            modifiers: []
            attributes:
              agent: "il"

          - id: "n002"
            type: transition
            label: "réussir(il)"
            token_span: [4, 4]
            origin: explicit
            scope: specific
            temporal_ref: {relative: {base: 0, offset: 1}}
            temporal_index: 1
            modifiers: []
            attributes:
              agent: "il"

        edges:
          # Motivation : la causalité est inversée — le but (réussir)
          # motive l'action (travailler). L'edge va de l'effet désiré
          # vers l'action qui le poursuit.
          - source: "n002"
            target: "n001"
            relation: motivation
            attributes:
              confidence: 1.0
              temporal_gap: null
              explicit: true
              negated: false
              marker_token: 3
