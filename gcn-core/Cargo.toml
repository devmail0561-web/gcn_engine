[workspace]
resolver = "2"
members = [
    "crates/gcn-ir",
    "crates/gcn-knowledge",
    "crates/gcn-frontend-fr",
    "crates/gcn-frontend-code",
    "crates/gcn-middleend",
    "crates/gcn-backend",
    "crates/gcn-cli",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10"
petgraph = "0.8"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive", "env"] }
rayon = "1.12"
smallvec = { version = "1.13", features = ["serde"] }
proptest = "1.11"
