[workspace]
resolver = "2"
members = [
    "crates/gcn-ir",
    "crates/gcn-frontend-fr",
    "crates/gcn-frontend-en",
    "crates/gcn-frontend-code",
    "crates/gcn-frontend-graph",
    "crates/gcn-frontend-table",
    "crates/gcn-middleend",
    "crates/gcn-backend",
    "crates/gcn-verbalizer",
    "crates/gcn-cli",
]

[workspace.package]
version = "4.0.0"
authors = ["Michel Tendeng"]
description = "GCN Causal Engine — symbolic causal extraction from natural language and code"
repository = "https://github.com/devmail0561-web/gcn_engine"
homepage = "https://github.com/devmail0561-web/gcn_engine"
documentation = "https://github.com/devmail0561-web/gcn_engine"
license = "Apache-2.0"
keywords = ["nlp", "causal", "graph", "extraction", "reasoning"]
categories = ["science", "text-processing"]
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = "0.8"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive", "env"] }
smallvec = { version = "1.13", features = ["serde"] }

# S5 audit — garde lints partagée (zéro comportement : micro-fixes mécaniques
# uniquement). Le reste de pedantic (casts, docs FR, must_use, bras identiques
# voulus) est volontairement exclu : bruit ou revue sémantique, voir CHANGELOG.
[workspace.lints.clippy]
uninlined_format_args = "warn"
redundant_closure_for_method_calls = "warn"
format_push_string = "warn"
map_unwrap_or = "warn"
