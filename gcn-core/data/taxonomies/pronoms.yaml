taxonomy: pronoms
version: "1.0"
description: Classification des pronoms selon leur fonction référentielle dans la Grammaire Causale Naturelle

classes:
  personnel:
    role: Référence directe à un participant de la chaîne causale
    examples_fr:
      - lemma: "je"
        note: agent locuteur
      - lemma: "tu"
        note: agent allocutaire
      - lemma: "il"
        note: agent ou patient tiers masculin
      - lemma: "elle"
        note: agent ou patient tiers féminin
      - lemma: "nous"
        note: agent collectif incluant le locuteur
      - lemma: "ils"
        note: agents tiers pluriel

  demonstratif:
    role: Référence déictique à une entité saillante dans le contexte causal
    examples_fr:
      - lemma: "celui-ci"
        note: proximal
      - lemma: "celui-là"
        note: distal
      - lemma: "ceci"
        note: référence proximale neutre
      - lemma: "cela"
        note: référence distale neutre
      - lemma: "ce"
        note: démonstratif réduit
      - lemma: "celle"
        note: féminin singulier

  relatif:
    role: Connecteur référentiel liant deux propositions dans une chaîne causale
    examples_fr:
      - lemma: "qui"
        note: sujet de la relative
      - lemma: "que"
        note: objet de la relative
      - lemma: "dont"
        note: complément de la relative
      - lemma: "où"
        note: localisation spatiotemporelle
      - lemma: "lequel"
        note: relatif composé

  indefini:
    role: Référence non spécifique signalant une lacune dans la chaîne causale
    signals_gap: true
    examples_fr:
      - lemma: "quelqu'un"
        note: agent indéterminé
      - lemma: "quelque chose"
        note: patient indéterminé
      - lemma: "rien"
        note: absence d'entité
      - lemma: "personne"
        note: absence d'agent
      - lemma: "on"
        note: agent générique ou anonyme
      - lemma: "certains"
        note: sous-ensemble indéterminé
