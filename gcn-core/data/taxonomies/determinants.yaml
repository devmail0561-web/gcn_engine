taxonomy: determinants
version: "1.0"
description: Classification des déterminants selon leur portée quantificationnelle dans la Grammaire Causale Naturelle

classes:
  defini:
    scope: specific
    role: Référence à une entité identifiée dans le contexte causal
    examples_fr:
      - lemma: "le"
        note: masculin singulier
      - lemma: "la"
        note: féminin singulier
      - lemma: "les"
        note: pluriel défini
      - lemma: "l'"
        note: élision devant voyelle

  indefini:
    scope: existential
    role: Introduction d'une entité nouvelle dans la chaîne causale
    examples_fr:
      - lemma: "un"
        note: masculin singulier
      - lemma: "une"
        note: féminin singulier
      - lemma: "des"
        note: pluriel indéfini

  partitif:
    scope: partial
    role: Référence à une quantité non délimitée d'une substance
    examples_fr:
      - lemma: "du"
        note: masculin singulier
      - lemma: "de la"
        note: féminin singulier
      - lemma: "de l'"
        note: élision devant voyelle
      - lemma: "des"
        note: pluriel partitif

  demonstratif:
    scope: specific
    role: Sélection déictique d'une entité dans le champ perceptuel ou discursif
    examples_fr:
      - lemma: "ce"
        note: masculin singulier devant consonne
      - lemma: "cet"
        note: masculin singulier devant voyelle
      - lemma: "cette"
        note: féminin singulier
      - lemma: "ces"
        note: pluriel démonstratif

  possessif:
    scope: specific
    role: Lien de possession entre un agent et une entité de la chaîne causale
    examples_fr:
      - lemma: "mon"
        note: première personne singulier
      - lemma: "ton"
        note: deuxième personne singulier
      - lemma: "son"
        note: troisième personne singulier
      - lemma: "notre"
        note: première personne pluriel
      - lemma: "leur"
        note: troisième personne pluriel

  quantitatif:
    scope: universal
    role: Quantification sur les entités de la chaîne causale
    examples_fr:
      - lemma: "tout"
        note: quantification universelle masculin singulier
      - lemma: "tous"
        note: quantification universelle masculin pluriel
      - lemma: "toute"
        note: quantification universelle féminin singulier
      - lemma: "toutes"
        note: quantification universelle féminin pluriel
      - lemma: "chaque"
        note: distribution individuelle
      - lemma: "aucun"
        scope: "null"
      - lemma: "aucune"
        scope: "null"
      - lemma: "plusieurs"
        note: pluralité indéterminée
      - lemma: "quelques"
        note: petite quantité
      - lemma: "certains"
        note: sous-ensemble indéfini

  interrogatif:
    scope: unknown
    role: Interrogation sur l'identité d'une entité dans la chaîne causale
    examples_fr:
      - lemma: "quel"
        note: masculin singulier
      - lemma: "quelle"
        note: féminin singulier
      - lemma: "quels"
        note: masculin pluriel
      - lemma: "quelles"
        note: féminin pluriel
      - lemma: "combien de"
        note: quantité interrogée
