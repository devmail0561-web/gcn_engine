taxonomy: verbes
version: "1.0"
description: Classification des verbes selon leur profil causal dans la Grammaire Causale Naturelle

classes:
  etat:
    description: Verbe exprimant une situation stable sans changement interne
    causal_direction: maintien
    formal: "S(t) = S(t+1)"
    examples_fr:
      - lemma: "être"
        note: copule existentielle
      - lemma: "avoir"
        note: possession stable
      - lemma: "savoir"
        note: connaissance acquise
      - lemma: "rester"
        note: persistance positionnelle
      - lemma: "demeurer"
        note: maintien dans un lieu ou un état
      - lemma: "sembler"
        note: apparence stable
      - lemma: "souffrir"
        note: état de souffrance subi
      - lemma: "subir"
        note: état de réception passive

  action:
    description: Verbe exprimant une intervention causale directe d'un agent
    causal_direction: production
    formal: "Agent → Effet"
    examples_fr:
      - lemma: "faire"
        note: action générique
      - lemma: "construire"
        note: création matérielle
      - lemma: "détruire"
        note: suppression causée
      - lemma: "donner"
        note: transfert volontaire
      - lemma: "prendre"
        note: acquisition active
      - lemma: "écrire"
        note: production symbolique
      - lemma: "frapper"
        note: impact physique direct
      - lemma: "courir"
        note: déplacement actif
      - lemma: "marcher"
        note: déplacement à pied
      - lemma: "travailler"
        note: activité productive volontaire
      - lemma: "réduire"
        note: diminution intentionnelle
      - lemma: "vendre"
        note: transfert commercial actif
      - lemma: "acheter"
        note: acquisition commerciale active
      - lemma: "vouloir"
        note: intention volontaire
      - lemma: "pouvoir"
        note: capacité habilitante
      - lemma: "devoir"
        note: obligation normative

  transition:
    description: Verbe marquant un changement d'état ponctuel
    causal_direction: rupture
    formal: "S(t) ≠ S(t+1), Δt → 0"
    examples_fr:
      - lemma: "devenir"
        note: changement d'état résultatif
      - lemma: "mourir"
        note: transition terminale
      - lemma: "naître"
        note: transition initiale
      - lemma: "tomber"
        note: changement spatial brusque
      - lemma: "éclater"
        note: rupture soudaine
      - lemma: "apparaître"
        note: émergence ponctuelle
      - lemma: "trébucher"
        note: chute accidentelle ponctuelle
      - lemma: "chuter"
        note: baisse soudaine
      - lemma: "réussir"
        note: transition vers le succès
      - lemma: "échouer"
        note: transition vers l'échec
      - lemma: "effondrer"
        note: effondrement ponctuel

  processus:
    description: Verbe exprimant un déroulement causal étendu dans le temps
    causal_direction: propagation
    formal: "S(t₀) → S(t₁) → ... → S(tₙ), Δt > 0"
    examples_fr:
      - lemma: "évoluer"
        note: transformation graduelle
      - lemma: "croître"
        note: augmentation progressive
      - lemma: "fondre"
        note: dissolution progressive
      - lemma: "vieillir"
        note: dégradation temporelle
      - lemma: "mûrir"
        note: développement vers un état final
      - lemma: "se propager"
        note: extension spatiotemporelle
      - lemma: "baisser"
        note: décroissance graduelle
      - lemma: "diminuer"
        note: réduction progressive
      - lemma: "décliner"
        note: dégradation lente
      - lemma: "reculer"
        note: recul progressif
      - lemma: "augmenter"
        note: croissance progressive
      - lemma: "monter"
        note: hausse graduelle
      - lemma: "progresser"
        note: avancement continu
      - lemma: "se développer"
        note: développement étendu

  auxiliaire:
    description: >
      Verbes auxiliaires n'exprimant pas de contenu causal propre.
      Utilisés pour former les temps composés et les périphrases verbales.
      Ils ne créent pas de noeud CIR — ils permettent d'identifier la tête lexicale du verbe composé.
    examples_fr:
      - lemma: "avoir"
        note: auxiliaire de temps composé
      - lemma: "a"
        note: présent avoir (auxiliaire)
      - lemma: "est"
        note: présent être (auxiliaire)
      - lemma: "ont"
        note: 3e pluriel avoir (auxiliaire)
      - lemma: "sont"
        note: 3e pluriel être (auxiliaire)
      - lemma: "avait"
        note: imparfait avoir (auxiliaire)
      - lemma: "était"
        note: imparfait être (auxiliaire)
      - lemma: "ait"
        note: subjonctif présent avoir (auxiliaire)
      - lemma: "aurait"
        note: conditionnel avoir (auxiliaire)
      - lemma: "serait"
        note: conditionnel être (auxiliaire)
      - lemma: "aura"
        note: futur avoir (auxiliaire)
      - lemma: "sera"
        note: futur être (auxiliaire)

compositional_rules:
  - pattern: "verb+depuis"
    result: processus
    description: La préposition depuis impose une lecture de déroulement étendu
  - pattern: "verb+imparfait+quand"
    result: etat
    description: L'imparfait combiné à quand fige le verbe en arrière-plan stable
  - pattern: "verb_etat+soudainement"
    result: transition
    description: Un adverbe de rupture convertit un état en transition ponctuelle
