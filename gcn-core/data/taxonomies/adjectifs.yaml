taxonomy: adjectifs
version: "1.0"
description: Classification des adjectifs selon leur rôle causal dans la Grammaire Causale Naturelle

classes:
  intrinseque:
    role: Propriété essentielle et permanente de l'entité
    examples_fr:
      - lemma: "humain"
        note: nature biologique
      - lemma: "vivant"
        note: état fondamental
      - lemma: "solide"
        note: propriété physique constitutive
      - lemma: "mortel"
        note: contrainte existentielle
      - lemma: "liquide"
        note: état de la matière
      - lemma: "naturel"
        note: origine non artificielle

  temporaire:
    role: Propriété transitoire résultant d'un processus causal
    examples_fr:
      - lemma: "malade"
        note: état pathologique réversible
      - lemma: "fatigué"
        note: résultat d'un effort
      - lemma: "ouvert"
        note: résultat d'une action
      - lemma: "cassé"
        note: résultat d'une rupture
      - lemma: "mouillé"
        note: résultat d'un contact avec l'eau
      - lemma: "satisfait"
        note: état émotionnel résultant

  relationnel:
    role: Propriété définissant un rapport entre entités
    examples_fr:
      - lemma: "national"
        note: appartenance géopolitique
      - lemma: "familial"
        note: lien de parenté
      - lemma: "économique"
        note: domaine systémique
      - lemma: "social"
        note: rapport collectif
      - lemma: "politique"
        note: rapport au pouvoir
      - lemma: "scientifique"
        note: rapport au savoir

  quantitatif:
    role: Propriété mesurant une grandeur ou une quantité
    examples_fr:
      - lemma: "grand"
        note: dimension spatiale
      - lemma: "nombreux"
        note: cardinalité élevée
      - lemma: "long"
        note: extension temporelle ou spatiale
      - lemma: "faible"
        note: intensité basse
      - lemma: "important"
        note: magnitude élevée
      - lemma: "léger"
        note: masse ou intensité faible

  temporel:
    role: Propriété situant l'entité dans le temps
    examples_fr:
      - lemma: "ancien"
        note: antériorité temporelle
      - lemma: "nouveau"
        note: émergence récente
      - lemma: "actuel"
        note: contemporanéité
      - lemma: "futur"
        note: postériorité temporelle
      - lemma: "récent"
        note: proximité temporelle passée
      - lemma: "permanent"
        note: persistance indéfinie
