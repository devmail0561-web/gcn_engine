# GCN-NL Dataset: Boucle de rétroaction causale (feedback loop)
# Quatre phrases juxtaposées formant un cycle causal négatif :
#   ventes baissent → coûts réduits → qualité se dégrade → ventes baissent encore plus
# La causalité est implicite (pas de marqueur conjonctif) — confidence 0.5

schema_version: "1.0"
format: gcn-nl

document:
  id: "doc-fr-cycles-001"
  lang: fr
  title: "Boucle de rétroaction négative — ventes/coûts/qualité"

  sentences:
    # ─────────────────────────────────────────────────────────
    # S1 : "Les ventes baissent."
    # ─────────────────────────────────────────────────────────
    - id: "s001"
      text: "Les ventes baissent."
      tokens:
        - id: 1
          form: "Les"
          lemma: "le"
          pos: "DET"
          dep_rel: "det"
          dep_head: 2
          gcn:
            causal_type: determinant
            causal_class: defini
            attributes:
              scope: universal

        - id: 2
          form: "ventes"
          lemma: "vente"
          pos: "NOUN"
          dep_rel: "nsubj"
          dep_head: 3
          gcn:
            causal_type: nom
            causal_class: processus

        - id: 3
          form: "baissent"
          lemma: "baisser"
          pos: "VERB"
          dep_rel: "root"
          dep_head: 0
          gcn:
            causal_type: verbe
            causal_class: processus
            attributes:
              direction: both
              reversibility: true

        - id: 4
          form: "."
          lemma: "."
          pos: "PUNCT"
          dep_rel: "punct"
          dep_head: 3

      cir:
        nodes:
          - id: "n001"
            type: processus
            label: "décroissance(ventes)"
            token_span: [2, 3]
            origin: explicit
            scope: universal
            temporal_ref: {relative: {base: 0, offset: 0}}
            temporal_index: 0
            modifiers: []
            attributes:
              entity: "ventes"
              quality: "décroissance"

        edges: []   # Pas d'edge intra-phrase

    # ─────────────────────────────────────────────────────────
    # S2 : "On réduit les coûts."
    # ─────────────────────────────────────────────────────────
    - id: "s002"
      text: "On réduit les coûts."
      tokens:
        - id: 1
          form: "On"
          lemma: "on"
          pos: "PRON"
          dep_rel: "nsubj"
          dep_head: 2
          gcn:
            causal_type: pronom
            causal_class: indefini
            attributes:
              scope: universal

        - id: 2
          form: "réduit"
          lemma: "réduire"
          pos: "VERB"
          dep_rel: "root"
          dep_head: 0
          gcn:
            causal_type: verbe
            causal_class: action
            attributes:
              direction: forward
              reversibility: true

        - id: 3
          form: "les"
          lemma: "le"
          pos: "DET"
          dep_rel: "det"
          dep_head: 4
          gcn:
            causal_type: determinant
            causal_class: defini
            attributes:
              scope: specific

        - id: 4
          form: "coûts"
          lemma: "coût"
          pos: "NOUN"
          dep_rel: "obj"
          dep_head: 2
          gcn:
            causal_type: nom
            causal_class: patient

        - id: 5
          form: "."
          lemma: "."
          pos: "PUNCT"
          dep_rel: "punct"
          dep_head: 2

      cir:
        nodes:
          - id: "n002"
            type: action
            label: "réduire(coûts)"
            token_span: [1, 4]
            origin: explicit
            scope: universal
            temporal_ref: {relative: {base: 0, offset: 1}}
            temporal_index: 1
            modifiers: []
            attributes:
              agent: "on"
              patient: "coûts"
              agent_type: collective

        edges: []

    # ─────────────────────────────────────────────────────────
    # S3 : "La qualité se dégrade."
    # ─────────────────────────────────────────────────────────
    - id: "s003"
      text: "La qualité se dégrade."
      tokens:
        - id: 1
          form: "La"
          lemma: "le"
          pos: "DET"
          dep_rel: "det"
          dep_head: 2
          gcn:
            causal_type: determinant
            causal_class: defini
            attributes:
              scope: specific

        - id: 2
          form: "qualité"
          lemma: "qualité"
          pos: "NOUN"
          dep_rel: "nsubj"
          dep_head: 4
          gcn:
            causal_type: nom
            causal_class: processus

        - id: 3
          form: "se"
          lemma: "se"
          pos: "PRON"
          dep_rel: "expl"
          dep_head: 4
          gcn:
            causal_type: pronom
            causal_class: personnel
            attributes:
              note: "pronom réfléchi — marque un processus autonome"

        - id: 4
          form: "dégrade"
          lemma: "dégrader"
          pos: "VERB"
          dep_rel: "root"
          dep_head: 0
          gcn:
            causal_type: verbe
            causal_class: processus
            attributes:
              direction: both

        - id: 5
          form: "."
          lemma: "."
          pos: "PUNCT"
          dep_rel: "punct"
          dep_head: 4

      cir:
        nodes:
          - id: "n003"
            type: processus
            label: "dégradation(qualité)"
            token_span: [2, 4]
            origin: explicit
            scope: specific
            temporal_ref: {relative: {base: 0, offset: 2}}
            temporal_index: 2
            modifiers: []
            attributes:
              entity: "qualité"
              quality: "dégradation"

        edges: []

    # ─────────────────────────────────────────────────────────
    # S4 : "Les ventes baissent encore plus."
    # ─────────────────────────────────────────────────────────
    - id: "s004"
      text: "Les ventes baissent encore plus."
      tokens:
        - id: 1
          form: "Les"
          lemma: "le"
          pos: "DET"
          dep_rel: "det"
          dep_head: 2
          gcn:
            causal_type: determinant
            causal_class: defini
            attributes:
              scope: universal

        - id: 2
          form: "ventes"
          lemma: "vente"
          pos: "NOUN"
          dep_rel: "nsubj"
          dep_head: 3
          gcn:
            causal_type: nom
            causal_class: processus

        - id: 3
          form: "baissent"
          lemma: "baisser"
          pos: "VERB"
          dep_rel: "root"
          dep_head: 0
          gcn:
            causal_type: verbe
            causal_class: processus
            attributes:
              direction: both
              reversibility: true

        - id: 4
          form: "encore"
          lemma: "encore"
          pos: "ADV"
          dep_rel: "advmod"
          dep_head: 3
          gcn:
            causal_type: adverbe
            causal_class: intensite
            attributes:
              value: 1.5

        - id: 5
          form: "plus"
          lemma: "plus"
          pos: "ADV"
          dep_rel: "advmod"
          dep_head: 4
          gcn:
            causal_type: adverbe
            causal_class: intensite
            attributes:
              value: 1.3

        - id: 6
          form: "."
          lemma: "."
          pos: "PUNCT"
          dep_rel: "punct"
          dep_head: 3

      cir:
        nodes:
          - id: "n004"
            type: processus
            label: "décroissance_amplifiée(ventes)"
            token_span: [2, 5]
            origin: explicit
            scope: universal
            temporal_ref: {relative: {base: 0, offset: 3}}
            temporal_index: 3
            modifiers:
              - kind: intensity
                value: 1.5
                source_form: "encore plus"
            attributes:
              entity: "ventes"
              quality: "décroissance"

        edges: []

  # ═══════════════════════════════════════════════════════════
  # Document-level causal graph (inter-sentence)
  # ═══════════════════════════════════════════════════════════
  causal_graph:
    nodes:
      - "n001"   # décroissance(ventes)
      - "n002"   # réduire(coûts)
      - "n003"   # dégradation(qualité)
      - "n004"   # décroissance_amplifiée(ventes)

    edges:
      # Toutes les relations sont implicites (juxtaposition, pas de marqueur)
      - source: "n001"
        target: "n002"
        relation: cause
        attributes:
          confidence: 0.5
          explicit: false
          negated: false
          temporal_gap:
            nature: deferred
            min: null
            max: null
          marker_token: null
          in_cycle: 1

      - source: "n002"
        target: "n003"
        relation: cause
        attributes:
          confidence: 0.5
          explicit: false
          negated: false
          temporal_gap:
            nature: deferred
            min: null
            max: null
          marker_token: null
          in_cycle: 1

      - source: "n003"
        target: "n004"
        relation: cause
        attributes:
          confidence: 0.5
          explicit: false
          negated: false
          temporal_gap:
            nature: deferred
            min: null
            max: null
          marker_token: null
          in_cycle: 1

    # ─────────────────────────────────────────────────────────
    # Cycles détectés par Tarjan SCC dans le middle-end
    # ─────────────────────────────────────────────────────────
    cycles:
      - id: 1
        path: ["n001", "n002", "n003", "n004"]
        cycle_type: feedback_negative
        description: >
          Boucle de rétroaction négative : la baisse des ventes entraîne
          une réduction des coûts, ce qui dégrade la qualité, ce qui
          amplifie la baisse des ventes. Le noeud n004 (décroissance
          amplifiée) partage l'entité "ventes" avec n001 — le middle-end
          fusionne les deux pour fermer le cycle dans le DiGraph.

    # ─────────────────────────────────────────────────────────
    # Résolution d'entités (coréférence inter-phrases)
    # ─────────────────────────────────────────────────────────
    entity_resolution:
      - entity: "ventes"
        nodes: ["n001", "n004"]
        merge_strategy: "entity"
        note: >
          n001 et n004 partagent l'entité "ventes". Dans le graphe
          petgraph, n004 est fusionné vers n001 (temporal_index le plus
          ancien conservé), ce qui crée l'arête retour n003 → n001 et
          ferme le cycle. Le modificateur intensity de n004 est propagé
          comme attribut du cycle (amplification).

  metadata:
    schema_version: "1.0"
    pipeline:
      - "gcn-frontend-fr::parser (UDPipe)"
      - "gcn-frontend-fr::annotator (règles taxonomiques)"
      - "gcn-frontend-fr::emitter (tokens → CIR)"
      - "gcn-middleend::resolver (coréférence inter-phrases)"
      - "gcn-middleend::graph (fusion incrémentale)"
      - "gcn-middleend::cycle (Tarjan SCC → feedback_negative)"
    created_at: "2026-09-14"
    source: "SAD.md section Schéma de dataset GCN-NL"
    notes:
      - "Causalité implicite par juxtaposition — confidence réduite à 0.5 (DA-8)"
      - "Cycle fermé par fusion d'entité 'ventes' entre n001 et n004 (L4)"
      - "Intensificateur 'encore plus' propagé comme propriété du cycle"
