# =============================================================================
# GCN-PL Dataset : Python Basic Examples
# Grammaire Causale Naturelle — Annotated Programming Language Dataset
#
# 2 Python snippets with full AST node annotation + CIR (Causal IR)
# Format: snippet → ast_nodes (tree-sitter) → cir (nodes + edges)
# =============================================================================

schema_version: "1.0"
dataset:
  id: "gcn-pl-python-basic"
  description: >
    Exemples Python annotés pour la Grammaire Causale Naturelle.
    Chaque snippet est décomposé en noeuds AST avec annotation GCN,
    puis converti en représentation intermédiaire causale (CIR).
  source_language:
    programming:
      lang: python

snippets:

  # =========================================================================
  # Snippet 1 : adjust_costs — conditional cost reduction
  # =========================================================================
  # def adjust_costs(sales):
  #     total = sum(sales)
  #     if total < threshold:
  #         reduction = total * 0.1
  #         return reduction
  #     return 0.0
  # =========================================================================
  - id: "py-001"
    lang: python
    source: |
      def adjust_costs(sales):
          total = sum(sales)
          if total < threshold:
              reduction = total * 0.1
              return reduction
          return 0.0

    ast_nodes:
      - id: 0
        kind: "function_definition"
        text: "def adjust_costs(sales):"
        span:
          start_line: 1
          start_col: 0
          end_line: 6
          end_col: 14
        gcn:
          causal_type: function_call
          attributes:
            pure: true
            side_effect: false
            function: "adjust_costs"

      - id: 1
        kind: "assignment"
        text: "total = sum(sales)"
        span:
          start_line: 2
          start_col: 4
          end_line: 2
          end_col: 22
        gcn:
          causal_type: assignment
          attributes:
            data_flow: write
            variable: "total"

      - id: 2
        kind: "call_expression"
        text: "sum(sales)"
        span:
          start_line: 2
          start_col: 12
          end_line: 2
          end_col: 22
        gcn:
          causal_type: function_call
          attributes:
            pure: true
            function: "sum"
            data_flow: read

      - id: 3
        kind: "if_statement"
        text: "if total < threshold:"
        span:
          start_line: 3
          start_col: 4
          end_line: 5
          end_col: 24
        gcn:
          causal_type: conditional
          attributes:
            control_flow: branch

      - id: 4
        kind: "assignment"
        text: "reduction = total * 0.1"
        span:
          start_line: 4
          start_col: 8
          end_line: 4
          end_col: 31
        gcn:
          causal_type: assignment
          attributes:
            data_flow: write
            variable: "reduction"

      - id: 5
        kind: "return_statement"
        text: "return reduction"
        span:
          start_line: 5
          start_col: 8
          end_line: 5
          end_col: 24
        gcn:
          causal_type: return_value
          attributes:
            data_flow: read
            variable: "reduction"

      - id: 6
        kind: "return_statement"
        text: "return 0.0"
        span:
          start_line: 6
          start_col: 4
          end_line: 6
          end_col: 14
        gcn:
          causal_type: return_value
          attributes:
            data_flow: read

    cir:
      nodes:
        - id: "n001"
          type: etat
          label: "total = sum(sales)"
          source_span:
            code_span:
              start_line: 2
              start_col: 4
              end_line: 2
              end_col: 22
          scope: specific
          modifiers: []
          temporal_ref: unresolved
          temporal_index: 0
          origin: explicit
          attributes:
            variable: "total"
            type_info: "float"
            data_flow: write

        - id: "n002"
          type: condition
          label: "total < threshold"
          source_span:
            code_span:
              start_line: 3
              start_col: 7
              end_line: 3
              end_col: 25
          scope: specific
          modifiers: []
          temporal_ref: unresolved
          temporal_index: 1
          origin: explicit
          attributes:
            value_constraint: "less_than(total, threshold)"
            control_flow: branch

        - id: "n003"
          type: action
          label: "reduction = total * 0.1"
          source_span:
            code_span:
              start_line: 4
              start_col: 8
              end_line: 4
              end_col: 31
          scope: specific
          modifiers: []
          temporal_ref: unresolved
          temporal_index: 2
          origin: explicit
          attributes:
            variable: "reduction"
            data_flow: write

        - id: "n004"
          type: etat
          label: "return reduction"
          source_span:
            code_span:
              start_line: 5
              start_col: 8
              end_line: 5
              end_col: 24
          scope: specific
          modifiers: []
          temporal_ref: unresolved
          temporal_index: 3
          origin: explicit
          attributes:
            variable: "reduction"
            data_flow: read

        - id: "n005"
          type: etat
          label: "return 0.0"
          source_span:
            code_span:
              start_line: 6
              start_col: 4
              end_line: 6
              end_col: 14
          scope: specific
          modifiers: []
          temporal_ref: unresolved
          temporal_index: 3
          origin: explicit
          attributes:
            data_flow: read

      edges:
        - source: "n001"
          target: "n002"
          relation: data_dependency
          confidence: 1.0
          temporal_gap: null
          explicit: true
          negated: false
          marker_token: null
          in_cycle: null

        - source: "n002"
          target: "n003"
          relation: condition
          confidence: 1.0
          temporal_gap: null
          explicit: true
          negated: false
          marker_token: null
          in_cycle: null

        - source: "n003"
          target: "n004"
          relation: data_dependency
          confidence: 1.0
          temporal_gap: null
          explicit: true
          negated: false
          marker_token: null
          in_cycle: null

        - source: "n002"
          target: "n005"
          relation: condition
          confidence: 1.0
          temporal_gap: null
          explicit: true
          negated: true    # else branch — condition not met
          marker_token: null
          in_cycle: null

      cycles: []
      unresolved: []
      metadata:
        schema_version: "1.0"
        pipeline:
          - "tree-sitter-python"
          - "gcn-frontend-code"

  # =========================================================================
  # Snippet 2 : inventory cleanup — loop with mutation and side effects
  # =========================================================================
  # for item in inventory:
  #     if item.expired:
  #         inventory.remove(item)
  #         log_removal(item)
  # =========================================================================
  - id: "py-002"
    lang: python
    source: |
      for item in inventory:
          if item.expired:
              inventory.remove(item)
              log_removal(item)

    ast_nodes:
      - id: 0
        kind: "for_statement"
        text: "for item in inventory:"
        span:
          start_line: 1
          start_col: 0
          end_line: 4
          end_col: 24
        gcn:
          causal_type: loop
          attributes:
            control_flow: loop_entry
            variable: "item"

      - id: 1
        kind: "if_statement"
        text: "if item.expired:"
        span:
          start_line: 2
          start_col: 4
          end_line: 4
          end_col: 24
        gcn:
          causal_type: conditional
          attributes:
            control_flow: branch

      - id: 2
        kind: "call_expression"
        text: "inventory.remove(item)"
        span:
          start_line: 3
          start_col: 8
          end_line: 3
          end_col: 30
        gcn:
          causal_type: mutation
          attributes:
            side_effect: true
            function: "remove"
            variable: "inventory"

      - id: 3
        kind: "call_expression"
        text: "log_removal(item)"
        span:
          start_line: 4
          start_col: 8
          end_line: 4
          end_col: 25
        gcn:
          causal_type: function_call
          attributes:
            side_effect: true
            function: "log_removal"

    cir:
      nodes:
        - id: "n001"
          type: processus
          label: "iterate(inventory)"
          source_span:
            code_span:
              start_line: 1
              start_col: 0
              end_line: 4
              end_col: 24
          scope: universal      # iterates over all items
          modifiers: []
          temporal_ref:
            range:
              start: 0
              end: -1           # unknown end — depends on collection size
          temporal_index: 0
          origin: explicit
          attributes:
            variable: "item"
            type_info: "Iterator"
            control_flow: loop_entry

        - id: "n002"
          type: condition
          label: "item.expired"
          source_span:
            code_span:
              start_line: 2
              start_col: 7
              end_line: 2
              end_col: 19
          scope: specific       # each individual item
          modifiers: []
          temporal_ref: unresolved
          temporal_index: 1
          origin: explicit
          attributes:
            value_constraint: "truthy(item.expired)"
            control_flow: branch

        - id: "n003"
          type: transition
          label: "inventory.remove(item)"
          source_span:
            code_span:
              start_line: 3
              start_col: 8
              end_line: 3
              end_col: 30
          scope: specific
          modifiers: []
          temporal_ref: unresolved
          temporal_index: 2
          origin: explicit
          attributes:
            variable: "inventory"
            function: "remove"
            data_flow: read_write
            side_effect: true

        - id: "n004"
          type: action
          label: "log_removal(item)"
          source_span:
            code_span:
              start_line: 4
              start_col: 8
              end_line: 4
              end_col: 25
          scope: specific
          modifiers: []
          temporal_ref: unresolved
          temporal_index: 3
          origin: explicit
          attributes:
            function: "log_removal"
            side_effect: true

      edges:
        - source: "n001"
          target: "n002"
          relation: control_dependency
          confidence: 1.0
          temporal_gap: null
          explicit: true
          negated: false
          marker_token: null
          in_cycle: null

        - source: "n002"
          target: "n003"
          relation: condition
          confidence: 1.0
          temporal_gap: null
          explicit: true
          negated: false
          marker_token: null
          in_cycle: null

        - source: "n001"
          target: "n003"
          relation: data_dependency
          confidence: 1.0
          temporal_gap: null
          explicit: true          # item flows from loop to remove call
          negated: false
          marker_token: null
          in_cycle: null

        - source: "n003"
          target: "n004"
          relation: sequence
          confidence: 1.0
          temporal_gap:
            min: 0
            max: 0
            nature: immediate
          explicit: true
          negated: false
          marker_token: null
          in_cycle: null

      cycles: []
      unresolved: []
      metadata:
        schema_version: "1.0"
        pipeline:
          - "tree-sitter-python"
          - "gcn-frontend-code"
