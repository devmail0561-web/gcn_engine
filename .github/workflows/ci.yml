name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  rust:
    name: Rust — test + clippy
    runs-on: self-hosted
    defaults:
      run:
        working-directory: gcn-core
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show   # installe la toolchain depuis rust-toolchain.toml
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --workspace --locked
      - run: which cargo-audit || cargo install cargo-audit --locked
      - run: cargo audit

  python:
    name: Python — pytest + ruff
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pip install -e "gcn-python[dev]"
      - run: ruff check gcn-python/src/ gcn-python/tests/
      - run: pytest gcn-python/tests/ -q

  transformers:
    name: gcn-transformers — pytest
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pip install -e "gcn-python[dev]"
      - run: pip install -e "gcn-transformers[dev]"
      - run: pytest gcn-transformers/tests/ -q

  annotate:
    name: gcn-annotate — pytest
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pip install -e "gcn-python[dev]"
      - run: pip install -e "gcn-tools/gcn-annotate[dev]"
      - run: pytest gcn-tools/gcn-annotate/tests/ -q

  scraper:
    name: gcn-scraper — pytest
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pip install -e "gcn-tools/gcn-scraper[dev]"
      - run: pytest gcn-tools/gcn-scraper/tests/ -q

  gates:
    name: Gates v4 — données gelées + smoke sans NaN
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pip install -e "gcn-python[dev]"
      # Smoke sans NaN : mini-trains jouets (marqueurs, sentence, quals).
      - run: pytest gcn-python/tests/test_marker_supervision.py gcn-python/tests/test_sentence_type.py gcn-python/tests/test_qual_heads.py -q
      # Gates données : DATA/ hors git → `make gates` en local, pas en CI.
