name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  rust:
    name: Rust — test + clippy
    runs-on: self-hosted
    defaults:
      run:
        working-directory: gcn-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gcn-core
      - run: cargo test --workspace
      - run: cargo clippy -- -D warnings

  python:
    name: Python — pytest
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "gcn-python[dev]"
      - run: pytest gcn-python/tests/ -q
