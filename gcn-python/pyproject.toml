[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcn-python"
version = "2.5.0"
description = "GCN Causal Engine — extract, model and reason over causal structure in natural language and code"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Michel Tendeng"},
]
keywords = ["nlp", "causal", "graph", "extraction", "reasoning", "causality", "gcn"]
dependencies = [
    "numpy>=1.24,<3.0",
    "click>=8.1,<9.0",
    "pyyaml>=6.0,<7.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/devmail0561-web/gcn_engine"
Documentation = "https://github.com/devmail0561-web/gcn_engine/blob/master/gcn-python/README.md"
Repository = "https://github.com/devmail0561-web/gcn_engine"
Changelog = "https://github.com/devmail0561-web/gcn_engine/blob/master/CHANGELOG.md"

[project.optional-dependencies]
embeddings = ["fasttext-wheel>=0.9.2"]
torch = ["torch>=2.0"]
dev = ["pytest>=7.4", "ruff>=0.1"]
all = ["gcn-python[embeddings,torch,dev]"]

[project.scripts]
gcn-discuss   = "gcn_python.discuss:discuss_cmd"
gcn-index     = "gcn_python.index:index_cmd"
gcn-train     = "gcn_python.training.train:train_cmd"
gcn-eval      = "gcn_python.evaluation.eval_runner:eval_cmd"
gcn-bootstrap = "gcn_python.training.bootstrap:bootstrap_cmd"
gcn-verbalize = "gcn_python.verbalizer.cli:verbalize_cmd"

[tool.hatch.build.targets.wheel]
packages = ["src/gcn_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

# ── Lint ─────────────────────────────────────────────────────────────────────
# Configuration explicite (auparavant : aucun [tool.ruff], ruff utilisait ses
# défauts opaques). `ruff check .` depuis gcn-python/ doit passer à 0 erreur.
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",        # erreurs de syntaxe / pyflakes / avertissements
    "I",                  # imports triés (isort)
    "UP",                 # modernisation Python 3.10+
    "B",                  # bugbear (pièges connus)
    "BLE",                # exceptions aveugles — chaque occurrence justifiée
    "SIM", "C4", "PIE",   # simplifications de code
    "RUF",                # règles propres à ruff
    "PLC", "PLE", "PLR", "PLW",  # pylint : correctness / errors / refactoring / warnings
    "PERF",               # pièges de performance
    "S",                  # sécurité (bandit)
    "DTZ",                # dates/timezones naïves
    "TRY",                # gestion d'erreurs
]
ignore = [
    # Longueur de ligne : 100 retenue ci-dessus, docstrings et formules numpy
    # restent au-delà ; E501 n'est pas un défaut de correction.
    "E501",
    # Imports locaux (dans une fonction) : volontaires — dépendances optionnelles
    # (torch, fasttext) et imports en fin de module pour éviter les cycles.
    "PLC0415",
    # raise ValueError("message long") : les messages détaillés sont destinés à
    # l'affichage CLI (gcn-train, gcn-eval) et aux utilisateurs finaux.
    "TRY003",
    # assert : assertions de pytest et invariants internes documentés.
    "S101",
    # subprocess.run([...], shell=False) avec liste d'arguments contrôlée
    # (bridge, bootstrap) : S603 ne peut pas vérifier la provenance des args.
    "S603",
    # Réassignation d'une variable dans une boucle (PLW2901) : style utilisé
    # volontairement pour accumuler un résultat sans variable de fusion.
    "PLW2901",
    # Documentation FR : guillemets et caractères accentués ambigus assumés.
    "RUF001", "RUF002", "RUF003",
    # try/except dans une boucle : la lisibilité prime sur le micro-gain (3 cas).
    "PERF203",
    # Valeurs magiques (tolérances numpy, seuils de perte) : documentées en
    # ligne ; extraire des constantes ici nuirait à la lisibilité des formules.
    "PLR2004",
    # Complexité des fonctions (arguments, branches, statements, returns) :
    # refactoring hors périmètre — les signatures publiques sont stables.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# pytest.importorskip() / mise en sys.path doivent précéder les imports.
"tests/**" = ["E402"]
